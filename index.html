<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MTC.LBS Microsoft Tech Club Git workshop participants."
    />
    <title>MTC.LBS | Participants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <a class="brand" href="./" aria-label="MTC.LBS participants">
          <span>MTC</span>.LBS
        </a>
        <p>Microsoft Tech Club</p>
      </header>

      <section aria-labelledby="page-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Git &amp; GitHub Workshop</p>
            <h1 id="page-title">Participants</h1>
          </div>
          <p id="resultCount" class="result-count" aria-live="polite">Loading participants…</p>
        </div>

        <label class="search-label" for="searchInput">Find a participant</label>
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Search by name, city, or interest"
          autocomplete="off"
        />

        <div id="participantsGrid" class="participants-grid" aria-live="polite"></div>
        <p id="emptyState" class="empty-state hidden" role="status">
          No participants found. Try another search.
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
